<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dota 2 Pro Matches — Análisis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --dota-dark:    #0a0c10;
      --dota-surface: #111520;
      --dota-card:    #161b26;
      --dota-border:  #1f2a3c;
      --dota-accent:  #c8973a;
      --dota-gold:    #e8b84b;
      --dota-radiant: #5cbf8a;
      --dota-dire:    #bf5c5c;
      --dota-text:    #d0d8e8;
      --dota-muted:   #6a7a90;
      --dota-blue:    #3d7abf;
    }
    * { box-sizing: border-box; }

    body {
      background: var(--dota-dark);
      color: var(--dota-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .dota-header {
      background: linear-gradient(180deg, #060810 0%, #0d1220 100%);
      border-bottom: 1px solid var(--dota-border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .dota-header .logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--dota-gold);
      text-transform: uppercase;
    }
    .dota-header .subtitle {
      font-size: .75rem;
      color: var(--dota-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── NAV TABS ── */
    .nav-dota {
      background: #0d1220;
      border-bottom: 1px solid var(--dota-border);
      padding: 0 2rem;
      display: flex;
      gap: 0;
      list-style: none;
      margin: 0;
    }
    .nav-dota .nav-item button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--dota-muted);
      padding: .85rem 1.4rem;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .nav-dota .nav-item button:hover { color: var(--dota-text); }
    .nav-dota .nav-item button.active {
      color: var(--dota-gold);
      border-bottom-color: var(--dota-gold);
    }

    /* ── STATS BAR ── */
    .stats-bar {
      background: var(--dota-surface);
      border-bottom: 1px solid var(--dota-border);
      padding: .6rem 2rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .stat-item .label { font-size: .7rem; color: var(--dota-muted); text-transform: uppercase; letter-spacing: .06em; }
    .stat-item .value { font-size: 1.1rem; font-weight: 800; color: var(--dota-gold); }
    .stat-item .value.radiant { color: var(--dota-radiant); }
    .stat-item .value.dire    { color: var(--dota-dire); }

    /* ── CONTENIDO ── */
    .tab-panel { display: none; padding: 1.5rem 2rem; }
    .tab-panel.active { display: block; }

    /* ── CARDS ── */
    .card-dota {
      background: var(--dota-card);
      border: 1px solid var(--dota-border);
      border-radius: 8px;
    }
    .card-dota .card-header-dota {
      background: var(--dota-surface);
      border-bottom: 1px solid var(--dota-border);
      padding: .75rem 1rem;
      font-weight: 700;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--dota-text);
      border-radius: 8px 8px 0 0;
    }

    /* ── TABLA ── */
    .table-dota { width: 100%; font-size: .82rem; border-collapse: collapse; }
    .table-dota thead th {
      background: var(--dota-surface);
      color: var(--dota-muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--dota-border);
      white-space: nowrap;
    }
    .table-dota tbody tr {
      border-bottom: 1px solid var(--dota-border);
      transition: background .15s;
      cursor: pointer;
    }
    .table-dota tbody tr:hover { background: rgba(200,151,58,.07); }
    .table-dota td { padding: .55rem .75rem; vertical-align: middle; }

    .badge-radiant { background: rgba(92,191,138,.15); color: var(--dota-radiant); border: 1px solid rgba(92,191,138,.3); padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
    .badge-dire    { background: rgba(191,92,92,.15);  color: var(--dota-dire);    border: 1px solid rgba(191,92,92,.3);  padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 700; }

    /* ── HERO GRID (estilo dota2.com/heroes) ── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: .75rem;
    }
    .hero-card {
      background: var(--dota-card);
      border: 1px solid var(--dota-border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
      position: relative;
    }
    .hero-card:hover { transform: translateY(-4px); border-color: var(--dota-accent); }
    .hero-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top;
      display: block;
    }
    .hero-card .hero-name {
      font-size: .7rem;
      font-weight: 700;
      text-align: center;
      padding: .35rem .25rem;
      color: var(--dota-text);
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-card .hero-wr {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .hero-card .hero-wr.wr-high { background: rgba(92,191,138,.85); color: #fff; }
    .hero-card .hero-wr.wr-low  { background: rgba(191,92,92,.85);  color: #fff; }
    .hero-card .hero-wr.wr-mid  { background: rgba(200,151,58,.85); color: #fff; }

    /* ── FORMULARIOS ── */
    .form-control-dota, .form-select-dota {
      background: var(--dota-surface);
      border: 1px solid var(--dota-border);
      color: var(--dota-text);
      border-radius: 6px;
      padding: .45rem .75rem;
      font-size: .85rem;
    }
    .form-control-dota:focus, .form-select-dota:focus {
      background: var(--dota-surface);
      border-color: var(--dota-accent);
      color: var(--dota-text);
      outline: none;
      box-shadow: 0 0 0 3px rgba(200,151,58,.2);
    }

    /* ── BOTONES ── */
    .btn-dota {
      background: linear-gradient(135deg, #b8832a, #8a5e1a);
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 6px;
      padding: .5rem 1.2rem;
      font-size: .85rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-dota:hover { opacity: .85; }
    .btn-dota-outline {
      background: transparent;
      border: 1px solid var(--dota-border);
      color: var(--dota-muted);
      border-radius: 6px;
      padding: .45rem .9rem;
      font-size: .82rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-dota-outline:hover { border-color: var(--dota-accent); color: var(--dota-text); }

    /* ── PAGINACIÓN ── */
    .pag-btn {
      background: var(--dota-surface);
      border: 1px solid var(--dota-border);
      color: var(--dota-muted);
      padding: .35rem .7rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: .82rem;
      transition: background .15s;
    }
    .pag-btn:hover, .pag-btn.active { background: var(--dota-accent); color: #fff; border-color: var(--dota-accent); }
    .pag-btn:disabled { opacity: .35; cursor: default; }

    /* ── DETALLE DE PARTIDA ── */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .4rem 0;
      border-bottom: 1px solid var(--dota-border);
      font-size: .82rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--dota-muted); }
    .stat-val-r { color: var(--dota-radiant); font-weight: 700; }
    .stat-val-d { color: var(--dota-dire);    font-weight: 700; }

    /* ── KNN RESULTADO ── */
    .knn-card {
      background: var(--dota-card);
      border: 1px solid var(--dota-border);
      border-radius: 8px;
      padding: .75rem 1rem;
      transition: border-color .15s;
    }
    .knn-card:hover { border-color: var(--dota-accent); }
    .knn-dist { font-size: 1.1rem; font-weight: 800; color: var(--dota-gold); }

    /* ── BARRA DE COMPARACIÓN ── */
    .compare-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--dota-border);
      overflow: hidden;
      margin-top: 4px;
    }
    .compare-fill { height: 100%; border-radius: 3px; }

    /* ── LOADING ── */
    .spinner-dota {
      width: 32px; height: 32px;
      border: 3px solid var(--dota-border);
      border-top-color: var(--dota-gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 2rem auto;
      display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 3rem; color: var(--dota-muted); }
    .empty-state i { font-size: 2.5rem; display: block; margin-bottom: .75rem; }

    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .stats-bar { gap: 1rem; }
      .tab-panel { padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="dota-header">
  <div>
    <div class="logo-text"><i class="bi bi-shield-fill-exclamation" style="color:var(--dota-accent)"></i> Dota 2 Pro Matches</div>
    <div class="subtitle">Análisis · Meta · KNN · 2019 – 2021</div>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item">
    <div class="label">Total partidas</div>
    <div class="value" id="sTotal">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Victorias Radiant</div>
    <div class="value radiant" id="sRadiant">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Victorias Dire</div>
    <div class="value dire" id="sDire">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Winrate Radiant</div>
    <div class="value" id="sWrR">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Winrate Dire</div>
    <div class="value" id="sWrD">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Primera partida</div>
    <div class="value" id="sPrimera" style="font-size:.85rem">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Última partida</div>
    <div class="value" id="sUltima" style="font-size:.85rem">—</div>
  </div>
</div>

<!-- TABS -->
<ul class="nav-dota" id="mainNav">
  <li class="nav-item"><button class="active" data-tab="tab-partidas">Partidas</button></li>
  <li class="nav-item"><button data-tab="tab-meta">Héroes del Meta</button></li>
  <li class="nav-item"><button data-tab="tab-detalle">Detalle de Partida</button></li>
  <li class="nav-item"><button data-tab="tab-knn">KNN — Partidas Similares</button></li>
</ul>

<!-- ══════════════════════════════════════════════════════════════
     TAB 1: PARTIDAS
══════════════════════════════════════════════════════════════ -->
<div id="tab-partidas" class="tab-panel active">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <select id="filtroGanador" class="form-select-dota" style="width:160px">
      <option value="todos">Todos</option>
      <option value="radiant">Radiant gana</option>
      <option value="dire">Dire gana</option>
    </select>
    <input id="filtroBuscar" type="text" class="form-control-dota" placeholder="Buscar match_id..." style="width:200px" />
    <button class="btn-dota" onclick="cargarPartidas(1)">Filtrar</button>
    <span class="ms-auto" style="color:var(--dota-muted);font-size:.8rem" id="countPartidas"></span>
  </div>

  <div class="card-dota">
    <div id="tablaPartidas"><div class="spinner-dota"></div></div>
  </div>

  <div class="d-flex align-items-center gap-2 mt-3 flex-wrap" id="paginacion"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     TAB 2: HÉROES DEL META
══════════════════════════════════════════════════════════════ -->
<div id="tab-meta" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <label style="color:var(--dota-muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em">Top:</label>
    <select id="topHeroes" class="form-select-dota" style="width:100px">
      <option value="20">20</option>
      <option value="30" selected>30</option>
      <option value="50">50</option>
    </select>
    <select id="ordenHeroes" class="form-select-dota" style="width:180px">
      <option value="freq">Mayor frecuencia de uso</option>
      <option value="winrate">Mayor winrate</option>
    </select>
    <button class="btn-dota" onclick="cargarMeta()">Cargar</button>
  </div>
  <div id="heroGrid" class="hero-grid"><div class="spinner-dota" style="grid-column:1/-1"></div></div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     TAB 3: DETALLE DE PARTIDA
══════════════════════════════════════════════════════════════ -->
<div id="tab-detalle" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <input id="inputMatchDetalle" type="number" class="form-control-dota" placeholder="Ingresa match_id..." style="width:220px" />
    <button class="btn-dota" onclick="cargarDetalle()">Ver Partida</button>
  </div>
  <div id="detalleContenido">
    <div class="empty-state"><i class="bi bi-search"></i>Ingresa un match_id para ver los detalles</div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     TAB 4: KNN
══════════════════════════════════════════════════════════════ -->
<div id="tab-knn" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <input id="inputMatchKnn" type="number" class="form-control-dota" placeholder="match_id de referencia..." style="width:220px" />
    <label style="color:var(--dota-muted);font-size:.82rem">K vecinos:</label>
    <select id="inputK" class="form-select-dota" style="width:90px">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
    <button class="btn-dota" onclick="ejecutarKNN()">Buscar Similares</button>
  </div>
  <div id="knnContenido">
    <div class="empty-state"><i class="bi bi-diagram-3"></i>Ingresa un match_id y el número K para encontrar partidas similares</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─── Estado global ────────────────────────────────────────────────────────────
let paginaActual = 1;
const POR_PAGINA = 20;

// ─── Utilidades ──────────────────────────────────────────────────────────────
const fmt = (v, dec = 2) => (v == null ? '—' : (+v).toFixed(dec));

function badgeGanador(ganador) {
  return ganador === 'Radiant'
    ? '<span class="badge-radiant">Radiant</span>'
    : '<span class="badge-dire">Dire</span>';
}

// ─── Navegación de pestañas ───────────────────────────────────────────────────
document.getElementById('mainNav').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('.nav-dota button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
});

// ─── Stats bar ────────────────────────────────────────────────────────────────
async function cargarStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('sTotal').textContent   = d.total_partidas.toLocaleString();
    document.getElementById('sRadiant').textContent = d.radiant_wins.toLocaleString();
    document.getElementById('sDire').textContent    = d.dire_wins.toLocaleString();
    document.getElementById('sWrR').textContent     = d.winrate_radiant + '%';
    document.getElementById('sWrD').textContent     = d.winrate_dire + '%';
    document.getElementById('sPrimera').textContent = d.primera_partida?.slice(0, 10) ?? '—';
    document.getElementById('sUltima').textContent  = d.ultima_partida?.slice(0, 10) ?? '—';
  } catch (e) { console.error('Error stats:', e); }
}

// ─── TAB 1: Partidas ─────────────────────────────────────────────────────────
async function cargarPartidas(pag = 1) {
  paginaActual = pag;
  const ganador = document.getElementById('filtroGanador').value;
  const buscar  = document.getElementById('filtroBuscar').value.trim();

  document.getElementById('tablaPartidas').innerHTML = '<div class="spinner-dota"></div>';

  const url = `/api/partidas?page=${pag}&per_page=${POR_PAGINA}&ganador=${ganador}`;
  const r   = await fetch(url);
  const d   = await r.json();

  let partidas = d.partidas;
  if (buscar) {
    partidas = partidas.filter(p => String(p.match_id).includes(buscar));
  }

  document.getElementById('countPartidas').textContent =
    `${d.total.toLocaleString()} partidas · pág ${d.pagina}/${d.paginas}`;

  const html = `
    <table class="table-dota">
      <thead>
        <tr>
          <th>Match ID</th>
          <th>Fecha</th>
          <th>Ganador</th>
          <th>Winrate R</th>
          <th>KDA R</th>
          <th>GPM R</th>
          <th>Winrate D</th>
          <th>KDA D</th>
          <th>GPM D</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${partidas.map(p => `
          <tr onclick="irDetalle(${p.match_id})">
            <td style="font-weight:700;color:var(--dota-gold)">${p.match_id}</td>
            <td style="color:var(--dota-muted)">${p.dt_match?.slice(0,10) ?? '—'}</td>
            <td>${badgeGanador(p.ganador)}</td>
            <td style="color:var(--dota-radiant)">${fmt(p.win_pct_r, 1)}%</td>
            <td style="color:var(--dota-radiant)">${fmt(p.kda_avg_r)}</td>
            <td style="color:var(--dota-radiant)">${fmt(p.gold_per_min_avg_r, 0)}</td>
            <td style="color:var(--dota-dire)">${fmt(p.win_pct_d, 1)}%</td>
            <td style="color:var(--dota-dire)">${fmt(p.kda_avg_d)}</td>
            <td style="color:var(--dota-dire)">${fmt(p.gold_per_min_avg_d, 0)}</td>
            <td style="color:var(--dota-muted);font-size:.75rem"><i class="bi bi-chevron-right"></i></td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  document.getElementById('tablaPartidas').innerHTML = html;
  renderPaginacion(d.paginas, pag, ganador);
}

function renderPaginacion(totalPags, actual, ganador) {
  const cont = document.getElementById('paginacion');
  const maxBtns = 7;
  let inicio = Math.max(1, actual - 3);
  let fin    = Math.min(totalPags, inicio + maxBtns - 1);
  if (fin - inicio < maxBtns - 1) inicio = Math.max(1, fin - maxBtns + 1);

  let html = `<button class="pag-btn" onclick="cargarPartidas(${actual - 1})" ${actual === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>`;
  for (let i = inicio; i <= fin; i++) {
    html += `<button class="pag-btn ${i === actual ? 'active' : ''}" onclick="cargarPartidas(${i})">${i}</button>`;
  }
  html += `<button class="pag-btn" onclick="cargarPartidas(${actual + 1})" ${actual === totalPags ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>`;
  cont.innerHTML = html;
}

function irDetalle(matchId) {
  document.getElementById('inputMatchDetalle').value = matchId;
  document.querySelectorAll('.nav-dota button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="tab-detalle"]').classList.add('active');
  document.getElementById('tab-detalle').classList.add('active');
  cargarDetalle(matchId);
}

// ─── TAB 2: Héroes del Meta ───────────────────────────────────────────────────
async function cargarMeta() {
  const top    = document.getElementById('topHeroes').value;
  const orden  = document.getElementById('ordenHeroes').value;
  const grid   = document.getElementById('heroGrid');
  grid.innerHTML = '<div class="spinner-dota" style="grid-column:1/-1"></div>';

  const r = await fetch(`/api/heroes/meta?top=${top}`);
  let heroes = await r.json();

  if (orden === 'winrate') {
    heroes.sort((a, b) => b.winrate - a.winrate);
  }

  if (!heroes.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="bi bi-emoji-frown"></i>Sin datos de héroes</div>';
    return;
  }

  grid.innerHTML = heroes.map(h => {
    const wr    = h.winrate;
    const wrCls = wr >= 55 ? 'wr-high' : wr <= 45 ? 'wr-low' : 'wr-mid';
    const img   = h.icono
      ? `<img src="${h.icono}" alt="${h.nombre}" loading="lazy" onerror="this.src='https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/antimage_vert.jpg'">`
      : `<div style="aspect-ratio:3/4;background:var(--dota-surface);display:flex;align-items:center;justify-content:center;color:var(--dota-muted);font-size:.7rem">${h.nombre}</div>`;
    return `
      <div class="hero-card" title="${h.nombre} — WR: ${wr}% — Partidas: ${h.partidas}">
        ${img}
        <span class="hero-wr ${wrCls}">${wr}%</span>
        <div class="hero-name">${h.nombre}</div>
      </div>`;
  }).join('');
}

// ─── TAB 3: Detalle de Partida ────────────────────────────────────────────────
async function cargarDetalle(matchId) {
  const id   = matchId ?? document.getElementById('inputMatchDetalle').value.trim();
  const cont = document.getElementById('detalleContenido');
  if (!id) return;

  cont.innerHTML = '<div class="spinner-dota"></div>';

  const r = await fetch(`/api/partida/${id}`);
  if (!r.ok) {
    cont.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>Partida ${id} no encontrada</div>`;
    return;
  }
  const d = await r.json();

  const statLabels = {
    recencia: 'Recencia', freq: 'Frecuencia', win_pct: 'Win %',
    duration_avg_win: 'Duración victoria (s)', duration_avg_lose: 'Duración derrota (s)',
    actions_per_min_avg: 'Acciones/min', ancient_kills_avg: 'Ancient kills',
    assists_avg: 'Asistencias', buyback_count_avg: 'Buybacks',
    courier_kills_avg: 'Courier kills', deaths_avg: 'Muertes',
    denies_avg: 'Denies', firstblood_claimed_avg: 'First blood',
    gold_avg: 'Oro', gold_per_min_avg: 'Oro/min',
    gold_spent_avg: 'Oro gastado', hero_damage_avg: 'Daño a héroes',
    hero_healing_avg: 'Curación', hero_kills_avg: 'Kills de héroes',
    kda_avg: 'KDA', kills_per_min_avg: 'Kills/min',
    lane_efficiency_avg: 'Eficiencia de carril', lane_kills_avg: 'Kills en carril',
    last_hits_avg: 'Last hits', level_avg: 'Nivel',
    neutral_kills_avg: 'Neutral kills', observer_kills_avg: 'Observer kills',
    observer_uses_avg: 'Observers usados', roshan_kills_avg: 'Roshan kills',
    sentry_kills_avg: 'Sentry kills', sentry_uses_avg: 'Sentries usados',
    total_gold_avg: 'Oro total', total_xp_avg: 'XP total',
    tower_damage_avg: 'Daño a torres', tower_kills_avg: 'Torres destruidas',
    xp_per_min_avg: 'XP/min',
  };

  const filaStats = Object.entries(statLabels).map(([key, label]) => {
    const vr = d.radiant?.stats?.[key];
    const vd = d.dire?.stats?.[key];
    const nr = vr != null ? (+vr).toFixed(2) : '—';
    const nd = vd != null ? (+vd).toFixed(2) : '—';

    // Barra comparativa
    const sumv = (vr ?? 0) + (vd ?? 0);
    const pctR = sumv > 0 ? Math.round(((vr ?? 0) / sumv) * 100) : 50;
    const pctD = 100 - pctR;

    return `
      <div class="stat-row">
        <span class="stat-val-r" style="width:90px;text-align:right">${nr}</span>
        <div style="flex:1;padding:0 1rem">
          <div class="stat-label" style="text-align:center;margin-bottom:3px">${label}</div>
          <div style="display:flex;height:5px;border-radius:3px;overflow:hidden">
            <div style="width:${pctR}%;background:var(--dota-radiant)"></div>
            <div style="width:${pctD}%;background:var(--dota-dire)"></div>
          </div>
        </div>
        <span class="stat-val-d" style="width:90px;text-align:left">${nd}</span>
      </div>`;
  }).join('');

  const heroesHtml = (heroes, cls) => heroes.map(h =>
    `<div style="display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--dota-border)">
      ${h.icono ? `<img src="${h.icono}" style="width:36px;height:36px;border-radius:4px;object-fit:cover;object-position:top" onerror="this.style.display='none'">` : ''}
      <span style="font-size:.8rem;font-weight:600;color:${cls};flex:1">${h.nombre}</span>
      <span style="font-size:.72rem;color:var(--dota-muted)">${h.frecuencia.toFixed(3)}</span>
    </div>`
  ).join('');

  cont.innerHTML = `
    <div class="mb-3 d-flex align-items-center gap-3 flex-wrap">
      <span style="font-size:1.2rem;font-weight:800;color:var(--dota-gold)">Match #${d.match_id}</span>
      <span style="color:var(--dota-muted);font-size:.85rem">${d.dt_match?.slice(0,10) ?? ''}</span>
      ${badgeGanador(d.ganador)}
      <button class="btn-dota-outline ms-auto" onclick="lanzarKNNDesdeDetalle(${d.match_id})">
        <i class="bi bi-diagram-3"></i> Ver partidas similares (KNN)
      </button>
    </div>

    <div class="row g-3">
      <!-- Estadísticas comparativas -->
      <div class="col-12 col-lg-7">
        <div class="card-dota">
          <div class="card-header-dota d-flex justify-content-between">
            <span style="color:var(--dota-radiant)"><i class="bi bi-circle-fill" style="font-size:.5rem"></i> Radiant</span>
            <span>Estadísticas por equipo</span>
            <span style="color:var(--dota-dire)"><i class="bi bi-circle-fill" style="font-size:.5rem"></i> Dire</span>
          </div>
          <div style="padding:.75rem 1rem;max-height:480px;overflow-y:auto">
            ${filaStats}
          </div>
        </div>
      </div>

      <!-- Héroes -->
      <div class="col-12 col-lg-5">
        <div class="row g-3">
          <div class="col-6">
            <div class="card-dota">
              <div class="card-header-dota" style="color:var(--dota-radiant)">Radiant — Héroes</div>
              <div style="padding:.5rem .75rem;max-height:350px;overflow-y:auto">
                ${heroesHtml(d.radiant?.heroes ?? [], 'var(--dota-radiant)')}
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="card-dota">
              <div class="card-header-dota" style="color:var(--dota-dire)">Dire — Héroes</div>
              <div style="padding:.5rem .75rem;max-height:350px;overflow-y:auto">
                ${heroesHtml(d.dire?.heroes ?? [], 'var(--dota-dire)')}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function lanzarKNNDesdeDetalle(matchId) {
  document.getElementById('inputMatchKnn').value = matchId;
  document.querySelectorAll('.nav-dota button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="tab-knn"]').classList.add('active');
  document.getElementById('tab-knn').classList.add('active');
  ejecutarKNN();
}

// ─── TAB 4: KNN ──────────────────────────────────────────────────────────────
async function ejecutarKNN() {
  const matchId = document.getElementById('inputMatchKnn').value.trim();
  const k       = parseInt(document.getElementById('inputK').value);
  const cont    = document.getElementById('knnContenido');

  if (!matchId) return;
  cont.innerHTML = '<div class="spinner-dota"></div>';

  const r = await fetch('/api/knn', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ match_id: parseInt(matchId), k }),
  });

  if (!r.ok) {
    cont.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>Partida no encontrada</div>`;
    return;
  }
  const d = await r.json();

  const refHtml = `
    <div class="card-dota mb-3" style="border-color:var(--dota-gold)">
      <div class="card-header-dota" style="color:var(--dota-gold)">Partida de referencia</div>
      <div style="padding:.75rem 1rem;display:flex;gap:2rem;flex-wrap:wrap">
        <div><div style="color:var(--dota-muted);font-size:.72rem">Match ID</div><div style="font-weight:800;color:var(--dota-gold)">${d.partida_referencia.match_id}</div></div>
        <div><div style="color:var(--dota-muted);font-size:.72rem">Fecha</div><div>${d.partida_referencia.dt_match?.slice(0,10) ?? '—'}</div></div>
        <div><div style="color:var(--dota-muted);font-size:.72rem">Ganador</div>${badgeGanador(d.partida_referencia.ganador)}</div>
        <div><div style="color:var(--dota-muted);font-size:.72rem">Win% Radiant</div><div style="color:var(--dota-radiant)">${fmt(d.partida_referencia.win_pct_r, 1)}%</div></div>
        <div><div style="color:var(--dota-muted);font-size:.72rem">Win% Dire</div><div style="color:var(--dota-dire)">${fmt(d.partida_referencia.win_pct_d, 1)}%</div></div>
      </div>
    </div>`;

  const similHtml = d.similares.map((s, i) => `
    <div class="knn-card mb-2" onclick="irDetalle(${s.match_id})" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--dota-surface);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:var(--dota-muted)">${i+1}</div>
        <div>
          <div style="font-size:.72rem;color:var(--dota-muted)">Match ID</div>
          <div style="font-weight:800;color:var(--dota-gold)">${s.match_id}</div>
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--dota-muted)">Fecha</div>
          <div style="font-size:.82rem">${s.dt_match?.slice(0,10) ?? '—'}</div>
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--dota-muted)">Ganador</div>
          ${badgeGanador(s.ganador)}
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--dota-muted)">Win% R/D</div>
          <div style="font-size:.82rem"><span style="color:var(--dota-radiant)">${fmt(s.win_pct_r,1)}%</span> / <span style="color:var(--dota-dire)">${fmt(s.win_pct_d,1)}%</span></div>
        </div>
        <div>
          <div style="font-size:.72rem;color:var(--dota-muted)">KDA R/D</div>
          <div style="font-size:.82rem"><span style="color:var(--dota-radiant)">${fmt(s.kda_avg_r)}</span> / <span style="color:var(--dota-dire)">${fmt(s.kda_avg_d)}</span></div>
        </div>
        <div class="ms-auto text-end">
          <div style="font-size:.72rem;color:var(--dota-muted)">Distancia</div>
          <div class="knn-dist">${s.distancia.toFixed(3)}</div>
        </div>
      </div>
      <!-- Barra de distancia relativa -->
      <div class="compare-bar mt-2">
        <div class="compare-fill" style="width:${Math.max(4, 100 - s.distancia / (d.similares[d.similares.length-1]?.distancia || 1) * 100)}%;background:var(--dota-gold)"></div>
      </div>
    </div>`).join('');

  cont.innerHTML = refHtml + `
    <div style="font-size:.8rem;color:var(--dota-muted);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em">
      ${d.k} partidas más similares (KNN Euclidiana normalizada)
    </div>` + similHtml;
}

// ─── Inicio ───────────────────────────────────────────────────────────────────
cargarStats();
cargarPartidas(1);
</script>
</body>
</html>
