<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dota 2 Pro Matches — Análisis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- HEADER -->
<div class="dota-header">
  <div>
    <div class="logo-text">
      <i class="bi bi-shield-fill-exclamation" style="color:var(--dota-accent)"></i>
      Dota 2 Pro Matches
    </div>
    <div class="subtitle">Análisis · Meta · KNN · 2019 – 2021</div>
  </div>
</div>

<!-- BARRA DE ESTADÍSTICAS GLOBALES -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item">
    <div class="label">Total partidas</div>
    <div class="value" id="sTotal">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Victorias Radiant</div>
    <div class="value radiant" id="sRadiant">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Victorias Dire</div>
    <div class="value dire" id="sDire">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Winrate Radiant</div>
    <div class="value" id="sWrR">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Winrate Dire</div>
    <div class="value" id="sWrD">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Primera partida</div>
    <div class="value" id="sPrimera" style="font-size:.85rem">—</div>
  </div>
  <div class="stat-item">
    <div class="label">Última partida</div>
    <div class="value" id="sUltima" style="font-size:.85rem">—</div>
  </div>
</div>

<!-- NAVEGACIÓN DE PESTAÑAS -->
<ul class="nav-dota" id="mainNav">
  <li class="nav-item">
    <button class="active" data-tab="tab-partidas">
      <i class="bi bi-table"></i> Partidas
    </button>
  </li>
  <li class="nav-item">
    <button data-tab="tab-meta">
      <i class="bi bi-person-badge"></i> Héroes del Meta
    </button>
  </li>
  <li class="nav-item">
    <button data-tab="tab-detalle">
      <i class="bi bi-search"></i> Detalle de Partida
    </button>
  </li>
  <li class="nav-item">
    <button data-tab="tab-knn">
      <i class="bi bi-diagram-3"></i> KNN — Partidas Similares
    </button>
  </li>
</ul>

<!-- TAB 1: LISTA DE PARTIDAS -->
<div id="tab-partidas" class="tab-panel active">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <select id="filtroGanador" class="form-select-dota" style="width:160px">
      <option value="todos">Todos</option>
      <option value="radiant">Radiant gana</option>
      <option value="dire">Dire gana</option>
    </select>
    <input id="filtroBuscar" type="text" class="form-control-dota"
           placeholder="Buscar match_id..." style="width:200px" />
    <button class="btn-dota" onclick="cargarPartidas(1)">
      <i class="bi bi-funnel"></i> Filtrar
    </button>
    <span class="ms-auto" style="color:var(--dota-muted);font-size:.8rem" id="countPartidas"></span>
  </div>
  <div class="card-dota">
    <div id="tablaPartidas"><div class="spinner-dota"></div></div>
  </div>
  <div class="d-flex align-items-center gap-2 mt-3 flex-wrap" id="paginacion"></div>
</div>

<!-- TAB 2: HÉROES DEL META -->
<div id="tab-meta" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <label style="color:var(--dota-muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em">Top:</label>
    <select id="topHeroes" class="form-select-dota" style="width:100px">
      <option value="20">20</option>
      <option value="30" selected>30</option>
      <option value="50">50</option>
    </select>
    <select id="ordenHeroes" class="form-select-dota" style="width:210px">
      <option value="freq">Mayor frecuencia de uso</option>
      <option value="winrate">Mayor winrate</option>
    </select>
    <button class="btn-dota" onclick="cargarMeta()">
      <i class="bi bi-grid"></i> Cargar
    </button>
  </div>

  <div id="heroGrid" class="hero-meta-grid">
    <div class="spinner-dota" style="grid-column:1/-1"></div>
  </div>
</div>

<!-- TAB 3: DETALLE DE PARTIDA -->
<div id="tab-detalle" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <input id="inputMatchDetalle" type="number" class="form-control-dota"
           placeholder="Ingresa match_id..." style="width:220px" />
    <button class="btn-dota" onclick="cargarDetalle()">
      <i class="bi bi-search"></i> Ver Partida
    </button>
  </div>
  <div id="detalleContenido"></div>
</div>

<!-- TAB 4: KNN — PARTIDAS SIMILARES -->
<div id="tab-knn" class="tab-panel">
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <input id="inputMatchKnn" type="number" class="form-control-dota"
           placeholder="match_id de referencia..." style="width:220px" />
    <label style="color:var(--dota-muted);font-size:.82rem">K vecinos:</label>
    <select id="inputK" class="form-select-dota" style="width:90px">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
    <button class="btn-dota" onclick="ejecutarKNN()">
      <i class="bi bi-diagram-3"></i> Buscar Similares
    </button>
  </div>
  <div id="knnContenido"></div>
</div>

<!-- Bootstrap JS (necesario para los popovers de héroes) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Lógica del frontend — ver static/js/app.js -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
